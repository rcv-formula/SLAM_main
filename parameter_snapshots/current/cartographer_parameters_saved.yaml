# Current Cartographer localization parameter snapshot.
# Captured before additional tuning changes on 2026-05-13.
#
# This file is a documentation/config snapshot. The active runtime files remain:
# - config.yaml
# - src/SLAM/cartographer_ros/configuration_files/Damvi_localization_config_wheel.lua
# - src/SLAM/cartographer_ros/launch/Damvi_carto_pure_wheel_launch.py

snapshot:
  captured_date: "2026-05-13"
  purpose: "Save current localization parameters before further changes"
  launch_file: "src/SLAM/cartographer_ros/launch/Damvi_carto_pure_wheel_launch.py"
  lua_file: "src/SLAM/cartographer_ros/configuration_files/Damvi_localization_config_wheel.lua"
  pose_extrapolator_config_file: "config.yaml"
  pbstream_file: "src/SLAM/cartographer_ros/pbstream/0312.pbstream"

launch:
  arguments:
    use_sim_time:
      default: true
    fusion_extrapolator:
      default: true
    pose_extrapolator_config:
      default: "config.yaml"
  environment:
    FUSION_EXTRPOLATOR: "fusion_extrapolator"
    WHEEL_ODOM_CONFIG: "pose_extrapolator_config"
    POSE_EXTRAPOLATOR_CONFIG: "pose_extrapolator_config"
  cartographer_node:
    package: "cartographer_ros"
    executable: "cartographer_node"
    name: "cartographer_node"
    output: "screen"
    arguments:
      collect_metrics: true
      configuration_directory: "src/SLAM/cartographer_ros/configuration_files"
      configuration_basename: "Damvi_localization_config_wheel.lua"
      load_state_filename: "src/SLAM/cartographer_ros/pbstream/0312.pbstream"
    remappings:
      scan: "scan"
      imu: "imu/data"
      tf: "tf"
      tf_static: "tf_static"
    ros_parameters:
      use_sim_time: true
      provide_odom_frame: true
      use_odometry: true
      publish_frame_projected_to_2d: true
  occupancy_grid_node:
    package: "cartographer_ros"
    executable: "cartographer_occupancy_grid_node"
    name: "occupancy_grid_node"
    output: "screen"
    parameters:
      resolution: 0.05
    remappings:
      map: "map"
      occupancy_grid: "map"
  trajectory_to_odom_node:
    package: "cartographer_ros"
    executable: "trajectory_to_odom"
    name: "trajectory_to_odom_node"
    output: "screen"
    parameters:
      use_sim_time: true

cartographer_lua:
  includes:
    - "map_builder.lua"
    - "trajectory_builder.lua"
  options:
    map_frame: "map"
    tracking_frame: "imu"
    published_frame: "base_link"
    odom_frame: "odom"
    provide_odom_frame: true
    use_odometry: true
    use_nav_sat: false
    use_landmarks: false
    publish_frame_projected_to_2d: true
    use_pose_extrapolator: true
    publish_to_tf: true
    lookup_transform_timeout_sec: 0.2
    submap_publish_period_sec: 0.025
    pose_publish_period_sec: 0.025
    trajectory_publish_period_sec: 0.025
    num_laser_scans: 1
    num_multi_echo_laser_scans: 0
    num_subdivisions_per_laser_scan: 1
    num_point_clouds: 0
    rangefinder_sampling_ratio: 1.0
    odometry_sampling_ratio: 1.0
    imu_sampling_ratio: 1.0
    fixed_frame_pose_sampling_ratio: 1.0
    landmarks_sampling_ratio: 1.0

  map_builder:
    use_trajectory_builder_2d: true
    num_background_threads: 4

  trajectory_builder:
    pure_localization_trimmer:
      max_submaps_to_keep: 4

  trajectory_builder_2d:
    use_imu_data: true
    num_accumulated_range_data: 1
    submaps:
      grid_options_2d:
        resolution: 0.05
    use_online_correlative_scan_matching: false
    real_time_correlative_scan_matcher:
      linear_search_window: 1.0
      angular_search_window_deg: 10.0
      angular_search_window_rad: 0.17453292519943295
      translation_delta_cost_weight: 5.0
      rotation_delta_cost_weight: 5.0
    min_range: 0.1
    max_range: 25.0
    missing_data_ray_length: 5.0
    adaptive_voxel_filter:
      max_length: 5.0
      min_num_points: 200
    voxel_filter_size: 0.05
    ceres_scan_matcher:
      occupied_space_weight: 50.0
      translation_weight: 20.0
      rotation_weight: 20.0
    imu_gravity_time_constant: 30.0

  pose_graph:
    optimize_every_n_nodes: 2
    global_constraint_search_after_n_seconds: 0
    global_sampling_ratio: 0.005
    constraint_builder:
      global_localization_min_score: 0.58
      min_score: 0.65
      fast_correlative_scan_matcher:
        linear_search_window: 1.5
        angular_search_window_deg: 10.0
        angular_search_window_rad: 0.17453292519943295
      max_constraint_distance: 15.0
      loop_closure_translation_weight: 2000.0
      loop_closure_rotation_weight: 2000.0
      sampling_ratio: 0.0001
    optimization_problem:
      odometry_translation_weight: 1000.0
      odometry_rotation_weight: 0.0

pose_extrapolator_effective_config:
  # Values explicitly present in config.yaml.
  imu_weight: 0.2
  imu_delta_min: 0.3
  wheelodom_weight: 0.01
  odometry_translation_weight: 1000.0
  odometry_rotation_weight: 0.0

  # Current C++ fallback values used when they are not present in config.yaml.
  process_noise: 0.001
  measurement_noise_scan_default: 0.0000015
  measurement_noise_odom_default: 0.0002
  measurement_noise_scan_low_score_or_straight: 0.0000055
  measurement_noise_odom_low_score_or_straight: 0.00012
  measurement_noise_scan_high_score_or_curve: 0.0000005
  measurement_noise_odom_high_score_or_curve: 0.001
  scan_match_low_score_threshold: 0.6
  scan_match_high_score_threshold: 0.9
  straight_yaw_speed_threshold: 0.15
  curve_yaw_speed_threshold: 0.41

tuning_notes:
  wheel_odom_translation_is_used_in:
    - "PoseExtrapolator local velocity correction: wheelodom_weight"
    - "Pose graph odometry residual: odometry_translation_weight"
  wheel_odom_rotation_is_currently_disabled_by:
    odometry_rotation_weight: 0.0
  fusion_enabled_by_default: true
