syntax = "proto3";

package cartographer.mapping.scan_matching.proto;

import "cartographer/mapping/proto/scan_matching/ceres_scan_matcher_options_2d.proto";
import "cartographer/mapping/proto/scan_matching/real_time_correlative_scan_matcher_options.proto";

// NEXT ID: 23
message FrozenSubmapScanMatcherOptions2D {
  enum ApplyMode {
    FULL_PIPELINE = 0;
    PUBLISH_ONLY = 1;
  }

  reserved 21;

  bool enabled = 1;
  ApplyMode apply_mode = 2;

  double search_radius = 3;
  int32 max_submaps_to_match = 4;

  bool use_realtime_correlative_scan_matching = 5;
  bool use_ceres_scan_matching = 6;

  double min_realtime_correlative_score = 7;
  double min_score_margin = 8;
  int32 score_variance_top_k = 9;
  double min_score_variance = 10;

  double max_translation_correction = 11;
  double max_rotation_correction = 12;

  RealTimeCorrelativeScanMatcherOptions
      real_time_correlative_scan_matcher_options = 13;
  CeresScanMatcherOptions2D ceres_scan_matcher_options = 14;

  bool tuning_log_enabled = 15;
  bool tuning_log_log_rejections = 16;
  bool tuning_log_log_acceptances = 17;
  int32 tuning_log_detail_every_n_scans = 18;
  int32 tuning_log_summary_every_n_scans = 19;
  int32 tuning_log_top_candidates = 20;
  bool test_mode_publish_filtered_odom = 22;
}
