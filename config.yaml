# 0501 bag metric tuning for imu_ver2.
# cartographer_node reads this once at startup through Damvi_carto_pure_metric_launch.py.
# Change values, then restart launch. IMU defaults are kept equal to current imu_ver2 source values.

# Local extrapolator fusion. Keep IMU conservative unless there is a clear reason to retune it.
imu_weight: 0.2
imu_delta_min: 0.4
wheelodom_weight: 0.01

# Pose graph wheel odometry residual weights.
odometry_translation_weight: 5000.0
odometry_rotation_weight: 0.0

# Global constraint / relocalization tuning.
global_localization_min_score: 0.58
constraint_min_score: 0.65
global_constraint_search_after_n_seconds: 0.0
global_linear_search_window: 1.5
global_angular_search_window_deg: 10.0
global_sampling_ratio: 0.006
initial_global_sampling_ratio: 0.05
initial_global_constraint_search_after_n_seconds: 0.0
initial_global_localization_min_score: 0.50
min_score_distribution_margin: 0.0
constraint_builder_sampling_ratio: 0.78
max_constraint_distance: 15.0
loop_closure_translation_weight: 20000.0
loop_closure_rotation_weight: 20000.0
optimize_every_n_nodes: 1
max_submaps_to_keep: 5
relocalization_trigger_sec: 6.0
relocalization_recovery_required_successes: 3
relocalization_recovery_grace_sec: 4.0

# Local matching search. These are included because they directly affect residual metrics.
local_linear_search_window: 0.20
local_angular_search_window_deg: 5.0
local_translation_delta_cost_weight: 25.0
local_rotation_delta_cost_weight: 25.0

# Outlier thresholds used only for local quality logging/filtering.
outlier_max_translation_residual: 0.15
outlier_max_rotation_residual: 0.03
outlier_required_failures: 2
outlier_medium_translation_residual: 0.10
outlier_medium_rotation_residual: 0.02
outlier_medium_required_consecutive: 4

num_background_threads: 8
